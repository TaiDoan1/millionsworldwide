<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào Mừng Bạn! ✨</title>
    <!-- Import font chữ dễ thương từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="referrer" content="no-referrer">
    
    <style>
        :root {
            /* Màu vàng bọt biển SpongeBob */
            --bg-color-1: #FFFBE6;
            --bg-color-2: #FFE066;
            --primary-color: #F57C00;
            --secondary-color: #FFB300;
            --text-color: #5C4033;
            --card-bg: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1) 0%, var(--bg-color-2) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Container chứa các phần tử GIF trôi nổi thay thế cho trái tim */
        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Các phần tử GIF trôi nổi */
        .floating-gift {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background: white;
            border: 2px solid white;
            padding: 2px;
            overflow: hidden;
            opacity: 0;
            animation: floatUp 12s infinite ease-in-out;
        }

        .floating-gift img,
        .floating-gift video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.7;
            }
            85% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-15vh) translateX(60px) scale(1) rotate(360deg);
                opacity: 0;
            }
        }

        /* Khung Card chính ở giữa màn hình */
        .welcome-card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 4px solid #FFF;
            border-radius: 32px;
            padding: 2.5rem 2rem;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(245, 124, 0, 0.15),
                        0 5px 15px rgba(0, 0, 0, 0.05);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Lời chào mừng dễ thương */
        .title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.8rem;
            text-shadow: 2px 2px 0px #FFF;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 600;
            color: #795548;
            margin-bottom: 2rem;
        }

        .sparkle-icon {
            display: inline-block;
            animation: spin 3s infinite linear;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Khung ảnh Polaroid chứa GIF/Video */
        .polaroid {
            background: white;
            padding: 12px 12px 24px 12px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transform: rotate(-2deg);
            transition: all 0.3s ease;
            display: inline-block;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .polaroid:hover {
            transform: rotate(1deg) scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 179, 0, 0.25);
        }

        .gif-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            background: #FFFDE7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gif-container img,
        .gif-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .polaroid-caption {
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            color: var(--primary-color);
            margin-top: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Container chứa các GIF trôi nổi được tự động tạo từ JavaScript -->
    <div class="decorations" id="decorations-container"></div>

    <!-- Khung nội dung chính -->
    <div class="welcome-card">
        <h1 class="title">MillionsWorldwide<span class="sparkle-icon">✨</span></h1>
        
        <!-- Thay đổi lời chào mừng của bạn ở đây -->
        <p class="message">
            Chúc bạn một ngày thật ngọt ngào và tràn đầy niềm vui nhé! 
            Chào mừng bạn đến với thế giới của chúng mình.
        </p>

        <!-- Khung ảnh Polaroid hiển thị GIF/Video -->
        <div class="polaroid">
            <div class="gif-container" id="main-media-container">
                <!-- Sẽ được tự động chèn bởi JavaScript dựa vào link cấu hình bên dưới -->
            </div>
            <div class="polaroid-caption">Lovely day for you! 🧸</div>
        </div>
    </div>

    <script>
        // ==========================================
        // CẤU HÌNH ĐƯỜNG DẪN GIF HOẶC VIDEO CỦA BẠN TẠI ĐÂY:
        // (Hỗ trợ cả link GIF, WebP truyền thống và file video MP4)
        
        // 1. Link GIF hiển thị chính trong khung Polaroid ở giữa trang:
        const MY_MAIN_MEDIA_URL = "https://media1.tenor.com/m/Ile97eFHbdIAAAAd/doggy-cute.gif";
        
        // 2. Danh sách các link GIF chạy hiệu ứng trôi nổi ở background nền (Thêm nhiều GIF khác nhau tại đây!):
        const FLOATING_MEDIA_URLS = [
            "https://media.tenor.com/meDTXXdESAoAAAAm/dancing-dance.webp",
            "https://media.tenor.com/GQAsycjoZG8AAAAm/scuba-scuba-cat.webp",
            "https://media.tenor.com/meDTXXdESAoAAAAm/dancing-dance.webp",
            "https://media.tenor.com/GQAsycjoZG8AAAAm/scuba-scuba-cat.webp",
            "https://media.tenor.com/meDTXXdESAoAAAAm/dancing-dance.webp",
            "https://media.tenor.com/GQAsycjoZG8AAAAm/scuba-scuba-cat.webp",
            "https://media.tenor.com/meDTXXdESAoAAAAm/dancing-dance.webp"
        ];
        // ==========================================

        // Hàm kiểm tra đường dẫn có phải là video (mp4, webm, v.v.) hay không
        function isVideo(url) {
            return url.toLowerCase().includes('.mp4') || 
                   url.toLowerCase().includes('.webm') || 
                   url.toLowerCase().includes('.ogg');
        }

        // Tạo phần tử media chính cho Polaroid
        const container = document.getElementById('main-media-container');
        if (isVideo(MY_MAIN_MEDIA_URL)) {
            const video = document.createElement('video');
            video.src = MY_MAIN_MEDIA_URL;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.setAttribute('playsinline', '');
            video.setAttribute('referrerpolicy', 'no-referrer');
            container.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = MY_MAIN_MEDIA_URL;
            img.alt = "Cute Welcome Gift";
            img.setAttribute('referrerpolicy', 'no-referrer');
            container.appendChild(img);
        }

        // Tạo hiệu ứng trôi nổi động bằng cách sử dụng nhiều đường dẫn GIF nền ngẫu nhiên
        const decorationsContainer = document.getElementById('decorations-container');
        const numFloatingElements = 15; // Tăng số lượng phần tử trôi nổi cho sinh động hơn

        for (let i = 0; i < numFloatingElements; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'floating-gift';
            
            // Random kích thước, vị trí bắt đầu và thời gian delay
            const size = Math.floor(Math.random() * 30) + 40; // 40px đến 70px
            const leftPos = Math.random() * 95; // 0% đến 95%
            const duration = Math.random() * 10 + 10; // 10s đến 20s (bay chậm và mượt hơn)
            const delay = Math.random() * 15; // 0s đến 15s

            wrapper.style.width = `${size}px`;
            wrapper.style.height = `${size}px`;
            wrapper.style.left = `${leftPos}%`;
            wrapper.style.animationDuration = `${duration}s`;
            wrapper.style.animationDelay = `-${delay}s`; // Bắt đầu chuyển động ngay lập tức

            // Lấy ngẫu nhiên một GIF trong danh sách đã cấu hình
            const randomMediaUrl = FLOATING_MEDIA_URLS[Math.floor(Math.random() * FLOATING_MEDIA_URLS.length)];

            // Thêm nội dung media nền vào phần tử nổi
            if (isVideo(randomMediaUrl)) {
                const miniVideo = document.createElement('video');
                miniVideo.src = randomMediaUrl;
                miniVideo.autoplay = true;
                miniVideo.loop = true;
                miniVideo.muted = true;
                miniVideo.setAttribute('playsinline', '');
                miniVideo.setAttribute('referrerpolicy', 'no-referrer');
                wrapper.appendChild(miniVideo);
            } else {
                const miniImg = document.createElement('img');
                miniImg.src = randomMediaUrl;
                miniImg.setAttribute('referrerpolicy', 'no-referrer');
                wrapper.appendChild(miniImg);
            }

            decorationsContainer.appendChild(wrapper);
        }
    </script>
</body>
</html>
